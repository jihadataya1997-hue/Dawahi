server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/manifest+json application/json;

  # طلبات /api تذهب لسيرفر ضواحي (حاوية dawahi-api على شبكة edge)
  resolver 127.0.0.11 valid=10s ipv6=off;
  location /api/ {
    set $api http://dawahi-api:3000;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 5m;
    proxy_read_timeout 30s;
  }

  location ~ \.webmanifest$ { default_type application/manifest+json; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location / { try_files $uri $uri/ /index.html; }
}
