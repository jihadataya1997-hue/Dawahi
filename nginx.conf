# كاش لصور الخريطة (منجيبها من OpenStreetMap مرة وحدة ومنخزنها عنا)
# تطبيق الأندرويد (ZappApp بالـ User-Agent) بيفتح التطبيق مباشرة، والمتصفح العادي بيشوف صفحة التعريف
map $http_user_agent $zapp_native { default 0; "~ZappApp" 1; }

proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:10m max_size=1g inactive=30d use_temp_path=off;

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  server_tokens off;
  # رؤوس أمان (لازم تتكرر بكل location فيها add_header لأن nginx ما بيورّثها)
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
  gzip_types text/css application/javascript image/svg+xml application/manifest+json application/json;

  # طلبات /api تذهب لسيرفر ضواحي (حاوية dawahi-api على شبكة edge)
  resolver 127.0.0.11 valid=10s ipv6=off;
  # صور الخريطة عن طريق سيرفرنا: OpenStreetMap صار يحجب الطلبات يلي ما فيها Referer صحيح
  location ~ ^/tiles/(\d+)/(\d+)/(\d+)\.png$ {
    set $osm tile.openstreetmap.org;
    proxy_pass https://$osm/$1/$2/$3.png;
    proxy_ssl_server_name on;
    proxy_set_header Host tile.openstreetmap.org;
    proxy_set_header User-Agent "ZAPPDelivery/1.0 (+https://zapp.prodev.cloud)";
    proxy_set_header Referer "https://zapp.prodev.cloud/";
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    proxy_cache tiles;
    proxy_cache_valid 200 7d;
    proxy_cache_valid 404 1m;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_lock on;
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options nosniff always;
  }
  location /api/ {
    set $api http://dawahi-api:3000;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 5m;
    proxy_read_timeout 30s;
  }

  location ~ \.webmanifest$ { default_type application/manifest+json; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; add_header Strict-Transport-Security "max-age=31536000" always; add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options SAMEORIGIN always; add_header Referrer-Policy strict-origin-when-cross-origin always; add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=()" always; add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always; }
  location = /sw.js { add_header Cache-Control "no-cache"; add_header Strict-Transport-Security "max-age=31536000" always; add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options SAMEORIGIN always; add_header Referrer-Policy strict-origin-when-cross-origin always; add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=()" always; add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always; }
  location = /index.html { add_header Cache-Control "no-cache"; add_header Strict-Transport-Security "max-age=31536000" always; add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options SAMEORIGIN always; add_header Referrer-Policy strict-origin-when-cross-origin always; add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=()" always; add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always; }
  # صفحة تنزيل التطبيق للزبائن
  location = /download { try_files /download.html =404; add_header Cache-Control "no-cache"; add_header Strict-Transport-Security "max-age=31536000" always; add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options SAMEORIGIN always; add_header Referrer-Policy strict-origin-when-cross-origin always; add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=()" always; add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always; }
  location = / {
    if ($zapp_native) { rewrite ^ /index.html last; }
    try_files /landing.html =404;
    add_header Cache-Control "no-cache";
    add_header Strict-Transport-Security "max-age=31536000" always; add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options SAMEORIGIN always; add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
  }
  location = /landing.html { return 301 /; }
  # تطبيق الزبون بالمتصفح
  location = /app { try_files /index.html =404; add_header Cache-Control "no-cache"; add_header Strict-Transport-Security "max-age=31536000" always; add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options SAMEORIGIN always; add_header Referrer-Policy strict-origin-when-cross-origin always; add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=()" always; add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always; }
  # صفحات الخصوصية والشروط وحذف الحساب (مطلوبة من Google Play)
  location = /privacy { try_files /privacy.html =404; }
  location = /terms { try_files /terms.html =404; }
  location = /delete-account { try_files /delete-account.html =404; }
  # تطبيقات الأندرويد (بتنبنى على السيرفر وبتنحط بمجلد منفصل)
  location ^~ /apk/ {
    alias /usr/share/nginx/apk/;
    types { application/vnd.android.package-archive apk; application/json json; application/octet-stream aab; }
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000" always;
  }
  # تطبيق الشب
  location = /driver { try_files /driver.html =404; add_header Cache-Control "no-cache"; add_header X-Robots-Tag "noindex"; add_header Strict-Transport-Security "max-age=31536000" always; add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options SAMEORIGIN always; add_header Referrer-Policy strict-origin-when-cross-origin always; add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=()" always; add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always; }
  location ^~ /driver/ { return 301 /driver; }
  # لوحة التحكم
  location = /admin { try_files /admin.html =404; add_header Cache-Control "no-cache"; add_header X-Robots-Tag "noindex"; add_header Strict-Transport-Security "max-age=31536000" always; add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options SAMEORIGIN always; add_header Referrer-Policy strict-origin-when-cross-origin always; add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=()" always; add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always; }
  location ^~ /admin/ { return 301 /admin; }
  location / { try_files $uri $uri/ /index.html; }
}
