# سيرفر ضواحي (API + قاعدة البيانات). البيانات محفوظة في volume اسمه dawahi-data
name: dawahi-api
services:
  api:
    image: node:22-alpine
    container_name: dawahi-api
    restart: unless-stopped
    networks: [edge]
    environment:
      PORT: "3000"
      DATA_DIR: /data
    volumes:
      - dawahi-data:/data
    command:
      - sh
      - -c
      - |
        set -e
        apk add --no-cache git >/dev/null
        rm -rf /app && git clone --depth 1 https://github.com/jihadataya1997-hue/dawahi.git /app
        exec node --disable-warning=ExperimentalWarning /app/server/server.mjs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 256m
volumes:
  dawahi-data: {}
networks:
  edge:
    external: true
    name: edge
